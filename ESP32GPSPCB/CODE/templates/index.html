<html>

<head>
    <title>ESP32 MAP TILE DOWNLOADER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        #map {
            height: 600px;
            width: 100%;
            border: 2px solid #333
        }
    </style>
</head>

<body>
    <h2> Select a Region to Download </h2>
    <div id="map"></div>
    <button id="downloadBtn" style="margin-top: 15px; padding: 10px 20px; font-size: 16px;">Download Map Tiles</button>

    <script>

        // JAVA

        var map = L.map('map').setView([31.5204, 74.3587], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            draw: {
                polygon: false,
                polyline: false,
                circle: false,
                marker: false,
                circlemarker: false,
                rectangle: {
                    shapeOptions: {
                        color: '#ff7800',
                        weight: 2.5,
                        dashArray: '10, 10',
                        fillColor: '#ff7800',
                        fillOpacity: 0.25
                    }
                }

            },
            edit: {
                featureGroup: drawnItems
            }
        });
        map.addControl(drawControl);

        var selectedBounds = null;

        map.on(L.Draw.Event.CREATED, function (event) {
            drawnItems.clearLayers(); // Clear previous drawings
            var layer = event.layer;
            drawnItems.addLayer(layer);

            selectedBounds = layer.getBounds();
            console.log("Rectangle Drawn! Bounds:", selectedBounds);
        });


        document.getElementById('downloadBtn').addEventListener('click', function () {
            if (!selectedBounds) {
                alert("Please draw a rectangle on the map to select the area for downloading tiles.");
                return;
            }

            var north = selectedBounds.getNorth();
            var south = selectedBounds.getSouth();
            var east = selectedBounds.getEast();
            var west = selectedBounds.getWest();


            alert("Map downloaded!\nNorth: " + north + "\nSouth: " + south + "\nEast: " + east + "\nWest: " + west);
        });
    </script>
</body>

</html>
